name: Set the Pages custom domain (one-off)
on:
  push:
    branches: [set-pages-domain]
permissions:
  pages: write
  contents: read
jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - name: Set apartment.kamelnabil.com
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          curl -sS -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages -d '{"cname":"apartment.kamelnabil.com"}' -w '\nHTTP %{http_code}\n'
          curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages
